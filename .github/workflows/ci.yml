name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatação (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Análise estática (go vet)
        run: go vet ./...

      # -race liga o detector de condição de corrida (precisa de cgo,
      # que existe no Linux do runner).
      - name: Testes (go test)
        run: go test -race -cover ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    # GITHUB_TOKEN precisa de packages:write para publicar no GHCR.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/matheus5339/go-api-lab
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      # Só publica em push na main (não em pull requests). A imagem pública
      # no GitHub Container Registry é o que o Azure Container Apps baixa.
      - name: Publicar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
